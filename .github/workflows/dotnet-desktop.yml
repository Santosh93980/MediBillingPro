name: MediBilling Pro build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore solution packages
        run: nuget restore .\MediBillingPro.Desktop\MediBillingPro.Desktop.sln

      - name: Build solution
        run: msbuild .\MediBillingPro.Desktop\MediBillingPro.Desktop.sln /m /p:Configuration=${{ matrix.configuration }}

      - name: Run tests
        run: dotnet test .\MediBillingPro.Desktop\MediBillingPro.Desktop.sln --configuration ${{ matrix.configuration }} --no-restore
